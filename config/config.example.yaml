# Example zammad-pdf-archiver configuration. Copy to config/config.yaml and adjust values.
# Do not commit secrets.

server:
  host: "0.0.0.0"
  port: 8080

zammad:
  base_url: "https://zammad.example.local"
  api_token: "CHANGE-ME"
  webhook_hmac_secret: "CHANGE-ME"
  timeout_seconds: 10.0
  verify_tls: true

workflow:
  trigger_tag: "pdf:sign"
  require_tag: true
  acknowledge_on_success: true
  delivery_id_ttl_seconds: 3600

fields:
  archive_path: "archive_path"
  archive_user_mode: "archive_user_mode"
  archive_user: "archive_user"

storage:
  root: "/srv/zammad-archive"
  fsync: true
  filename_pattern: "Ticket-{ticket_number}_{timestamp_utc}.pdf"

pdf:
  locale: "de_DE"
  timezone: "Europe/Berlin"
  max_articles: 250
  article_limit_mode: "fail" # fail|cap_and_continue

signing:
  enabled: false
  pfx_path: null
  pfx_password: null
  pades:
    reason: "Ticket Archivierung"
    location: "Datacenter"
  timestamp:
    enabled: false
    rfc3161:
      tsa_url: null
      timeout_seconds: 10.0
      ca_bundle_path: null
      user: null
      password: null

observability:
  log_level: "INFO"
  log_format: "json"
  metrics_enabled: false
  metrics_bearer_token: null
  history_enabled: false
  history_bearer_token: null
  healthz_omit_version: false

retry_bearer_token: null

hardening:
  rate_limit:
    enabled: true
    rps: 5.0
    burst: 10
    include_metrics: false
    client_key_header: null
  body_size_limit:
    max_bytes: 1048576
  webhook:
    require_delivery_id: false
  transport:
    trust_env: false
    allow_insecure_http: false
    allow_private_networks: false

admission:
  max_pending: 100
  max_running: 4
  shutdown_timeout_seconds: 5.0
