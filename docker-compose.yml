# =============================================================================
# Production Docker Compose for zammad-pdf-archiver
# =============================================================================
#
# Usage:
#   1. Copy .env.example to .env and edit with your values
#   2. docker compose up -d --build
#   3. curl http://localhost:8080/healthz
#
# For dev/hot-reload, use: docker compose -f docker-compose.dev.yml up --build
#
# Note: the `env_file` object form below requires Docker Compose >= 2.24.0.
# If your client reports parse errors around `path` or `required`, upgrade Compose.
#
# See README.md and docs/deploy.md for full deployment instructions.
# =============================================================================

services:
  zammad-pdf-archiver:
    image: zammad-pdf-archiver:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    env_file:
      # Docker Compose >= 2.24.0 required for `path` + `required`.
      - path: .env
        required: false
    environment:
      # Sane defaults -- override in .env or host environment.
      SERVER_HOST: "${SERVER_HOST:-0.0.0.0}"
      SERVER_PORT: "${SERVER_PORT:-8080}"
      STORAGE__ROOT: "${STORAGE__ROOT:-/mnt/archive}"
      SIGNING__PFX_PATH: "${SIGNING__PFX_PATH:-/run/secrets/signing.pfx}"
    volumes:
      # Config file (optional). Set CONFIG_PATH=./config/config.yaml in .env to enable.
      - ./config:/app/config:ro

      # Archive storage: bind-mount the host path where PDFs should be written.
      # The host path is typically a CIFS/SMB mount managed by the host OS.
      - "${STORAGE__ROOT:-/mnt/archive}:${STORAGE__ROOT:-/mnt/archive}:rw"

    # Signing material (uncomment when SIGNING__ENABLED=true):
      # - /etc/zammad-archiver/secrets/signing.pfx:/run/secrets/signing.pfx:ro

    # Security hardening: read-only root filesystem, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,urllib.request; p=os.getenv('SERVER_PORT','8080'); urllib.request.urlopen(f'http://127.0.0.1:{p}/healthz', timeout=2).read()\"",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
