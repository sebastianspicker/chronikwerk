name: Security

# Policy:
# - This workflow runs `pip-audit` against the project dependencies.
# - It fails on CRITICAL and HIGH vulnerabilities:
#   - If OSV provides `database_specific.severity`, we require it not to be CRITICAL or HIGH.
#   - Otherwise we use CVSS base score (CRITICAL := >= 9.0, HIGH := >= 7.0).
#   - If severity cannot be determined, we fail closed (treat as CRITICAL).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1" # weekly (UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install audit tools
        run: |
          python -m pip install --no-cache-dir -U pip
          python -m pip install --no-cache-dir -U pip-audit cvss

      - name: Run pip-audit (JSON)
        run: |
          # pip-audit returns exit code 1 when it finds vulnerabilities.
          # We always capture JSON and enforce our policy in the next step.
          pip-audit -f json -s osv --desc off --aliases on -o pip-audit.json . || true
          if [ ! -f pip-audit.json ]; then echo '{"dependencies":[]}' > pip-audit.json; fi

      - name: Enforce policy (fail on CRITICAL and HIGH)
        run: |
          python scripts/ci/enforce_pip_audit_policy.py
