name: Security

# Policy:
# - This workflow runs `pip-audit` against the project dependencies.
# - It fails on CRITICAL and HIGH vulnerabilities:
#   - If OSV provides `database_specific.severity`, we require it not to be CRITICAL or HIGH.
#   - Otherwise we use CVSS base score (CRITICAL := >= 9.0, HIGH := >= 7.0).
#   - If severity cannot be determined, we fail closed (treat as CRITICAL).

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1" # weekly (UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install audit tools
        run: |
          python -m pip install --no-cache-dir -U pip
          python -m pip install --no-cache-dir -U pip-audit cvss

      - name: Audit base production dependencies
        run: |
          set +e
          pip-audit -f json -s osv --desc off --aliases on -o pip-audit-base.json .
          audit_status=$?
          set -e
          printf '{"tool":"pip-audit","exit_code":%s}\n' "$audit_status" > pip-audit-base.status.json

      - name: Enforce base audit policy
        run: |
          PIP_AUDIT_INPUT_PATH=pip-audit-base.json \
          PIP_AUDIT_STATUS_PATH=pip-audit-base.status.json \
          python scripts/ci/enforce_pip_audit_policy.py

      - name: Install signing production dependencies
        run: python -m pip install --no-cache-dir -U ".[signing]"

      - name: Audit signing production dependencies
        run: |
          set +e
          # Audit the installed signing environment, not the base project
          # metadata, so the extra package set is actually covered.
          pip-audit --local -f json -s osv --desc off --aliases on -o pip-audit-signing.json
          audit_status=$?
          set -e
          printf '{"tool":"pip-audit","exit_code":%s}\n' "$audit_status" > pip-audit-signing.status.json

      - name: Enforce signing audit policy and package coverage
        run: |
          PIP_AUDIT_INPUT_PATH=pip-audit-signing.json \
          PIP_AUDIT_STATUS_PATH=pip-audit-signing.status.json \
          PIP_AUDIT_REQUIRED_PACKAGES=cryptography,pyhanko,pyhanko-certvalidator,asn1crypto \
          python scripts/ci/enforce_pip_audit_policy.py
