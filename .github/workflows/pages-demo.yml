name: Pages demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages-demo.yml"
      - "demo/**"
      - "docs/screenshots/**"
      - "frontend/admin/css/**"
      - "scripts/ci/assemble_admin_css.py"
      - "scripts/ci/build_pages_demo.py"
      - "scripts/ci/check_pages_demo.py"
      - "src/chronikwerk/web/static/admin/admin.css"
      - "src/chronikwerk/web/static/admin/chronikwerk-mark.svg"
      - "Makefile"
      - "package-lock.json"
      - "package.json"

concurrency:
  group: pages-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend build tools
        run: npm ci --ignore-scripts

      - name: Build and validate static demo
        run: make pages-demo-check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: build/pages-demo

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
