name: CI

on:
  push:
    branches: [dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system deps (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 \
            libffi-dev \
            libgdk-pixbuf2.0-0 \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            fonts-dejavu-core \
            shared-mime-info

      - name: Install
        run: |
          python -m pip install --no-cache-dir -U pip
          python -m pip install --no-cache-dir ".[dev,redis]"

      - name: Smoke test
        run: |
          bash scripts/ci/smoke-test.sh

      - name: Docs check
        run: |
          make docs-check

      - name: Ruff
        run: |
          ruff check .

      - name: Complexity budget (C901)
        run: |
          ruff check src --select C901

      - name: Mypy
        run: |
          mypy . --config-file pyproject.toml

      - name: Pytest (allow none collected)
        run: |
          pytest -q --cov=src/zammad_pdf_archiver --cov-report=term-missing --cov-fail-under=85 || (test $? -eq 5 && echo "No tests collected (bootstrap stage)" && exit 0)

      - name: Build (sdist/wheel)
        run: |
          python -m pip install --no-cache-dir -U build
          python -m build

      - name: Dockerfile.dev smoke start
        run: |
          docker build -f Dockerfile.dev -t zammad-pdf-archiver-dev:ci .
          docker run -d --rm --name zpa-dev-smoke \
            -p 18080:8080 \
            -e ZAMMAD_BASE_URL=https://example.invalid \
            -e ZAMMAD_API_TOKEN=x \
            -e STORAGE_ROOT=/tmp \
            -e HARDENING_WEBHOOK_ALLOW_UNSIGNED=true \
            -e HARDENING_WEBHOOK_ALLOW_UNSIGNED_WHEN_NO_SECRET=true \
            zammad-pdf-archiver-dev:ci
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz
          docker rm -f zpa-dev-smoke

      - name: Wheel install (clean venv)
        run: |
          python -m venv /tmp/wheel-venv
          source /tmp/wheel-venv/bin/activate
          python -m pip install --no-cache-dir -U pip
          python -m pip install --no-cache-dir dist/*.whl
          python - <<'PY'
          from zammad_pdf_archiver.app.server import create_app
          from zammad_pdf_archiver.config.settings import Settings

          settings = Settings.from_mapping(
              {
                  "zammad": {"base_url": "https://example.invalid", "api_token": "x"},
                  "storage": {"root": "/tmp"},
                  "hardening": {"webhook": {"allow_unsigned": True}},
              }
          )
          app = create_app(settings)
          assert app.title == "zammad-pdf-archiver"
          print("wheel-import-ok", app.version)
          PY

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
