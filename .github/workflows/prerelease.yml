name: Prerelease

on:
  push:
    tags:
      - "v*-alpha.*"
      - "v*-beta.*"
      - "v*-rc.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  release:
    needs: [ci, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"

      - name: Validate tag, project version, and changelog section
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["TAG_NAME"]
          match = re.fullmatch(r"v(\d+\.\d+\.\d+)-(alpha|beta|rc)\.(\d+)", tag)
          if match is None:
              raise SystemExit(f"invalid prerelease tag: {tag}")
          marker = {"alpha": "a", "beta": "b", "rc": "rc"}[match.group(2)]
          normalized = f"{match.group(1)}{marker}{match.group(3)}"
          with Path("pyproject.toml").open("rb") as handle:
              project_version = tomllib.load(handle)["project"]["version"]
          if project_version != normalized:
              raise SystemExit(
                  f"tag/version mismatch: {tag} normalizes to {normalized}, "
                  f"project.version is {project_version}"
              )
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = f"## [{tag[1:]}]"
          heading_pattern = re.compile(
              rf"{re.escape(heading)}(?: - \d{{4}}-\d{{2}}-\d{{2}})?"
          )
          lines = changelog.splitlines()
          start = next(
              (index + 1 for index, line in enumerate(lines) if heading_pattern.fullmatch(line)),
              None,
          )
          if start is None:
              raise SystemExit(f"missing exact CHANGELOG section: {heading}")
          end = next((i for i in range(start, len(lines)) if lines[i].startswith("## [")), len(lines))
          if not any(line.strip() for line in lines[start:end]):
              raise SystemExit(f"empty CHANGELOG section: {heading}")
          Path("release-notes.md").write_text(
              "\n".join(lines[start:end]).rstrip() + "\n", encoding="utf-8"
          )
          PY

      - name: Download verified CI distribution artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Generate checksums from verified artifacts
        run: |
          test -n "$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: true
          body_path: release-notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
