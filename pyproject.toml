[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronikwerk"
version = "0.3.0a1"
description = "Auditable ticket archiving for Zammad."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
keywords = ["zammad", "pdf", "archiving", "fastapi"]
authors = [
  { name = "Maintainers", email = "sebastianspicker@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Framework :: FastAPI",
  "Typing :: Typed",
]

dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "Jinja2>=3.1,<4.0",
  "PyYAML>=6.0,<7.0",
  "httpx>=0.27,<1.0",
  "structlog>=24.0,<26.0",
  "prometheus-client>=0.20,<1.0",
  "weasyprint>=69.0,<70",
]

[project.optional-dependencies]
signing = [
  "asn1crypto>=1.5,<2.0",
  "cryptography>=50.0.0,<51",
  "pyhanko>=0.26,<0.35",
  "pyhanko-certvalidator>=0.26,<0.31",
]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.0",
  "pytest>=8.0",
  "respx>=0.21",
  "ruff>=0.4",
  "mypy>=1.10",
  "lizard==1.24.0",
  "types-PyYAML",
  "chronikwerk[signing]",
]
[project.urls]
Repository = "https://github.com/sebastianspicker/chronikwerk"
"Bug Tracker" = "https://github.com/sebastianspicker/chronikwerk/issues"
Changelog = "https://github.com/sebastianspicker/chronikwerk/blob/main/CHANGELOG.md"
Documentation = "https://github.com/sebastianspicker/chronikwerk#documentation"

[project.scripts]
chronikwerk = "chronikwerk.runtime:main"
chronikwerk-admin = "chronikwerk.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chronikwerk = [
  "py.typed",
  "documents/templates/**/*.css",
  "documents/templates/**/*.html",
  "web/templates/**/*.html",
  "web/static/**/*.css",
  "web/static/**/*.js",
  "web/static/**/*.svg",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = [
  "^build/",
  "^dist/",
  "^scripts/",
]

[[tool.mypy.overrides]]
# asn1crypto and weasyprint have no type stubs; ignores are intentional
module = ["asn1crypto.*", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=.env.example --ignore=.pytest_cache -p no:cacheprovider"

[tool.coverage.run]
branch = true
source = ["chronikwerk"]

[tool.coverage.report]
fail_under = 57
