[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zammad-pdf-archiver"
version = "0.2.0rc2"
description = "FastAPI webhook service to archive Zammad tickets as PDFs (optional PAdES signing + RFC3161 timestamp) to filesystem storage."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Maintainers", email = "sebastianspicker@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Typing :: Typed",
]

dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "Jinja2>=3.1,<4.0",
  "PyYAML>=6.0,<7.0",
    "httpx>=0.27,<1.0",
    "structlog>=24.0,<26.0",
    "prometheus-client>=0.20,<1.0",
    "weasyprint>=68.0,<69",
]

[project.optional-dependencies]
signing = [
    "asn1crypto>=1.5,<2.0",
    "cryptography>=48.0.1,<50",
    "pyhanko>=0.26,<0.35",
    "pyhanko-certvalidator>=0.26,<0.31",
]
dev = [
    "build>=1.2",
    "pytest>=8.0",
  "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.7",
    "zammad-pdf-archiver[signing]",
]
[project.urls]
Repository = "https://github.com/sebastianspicker/zammad-ticket-archiver"
"Bug Tracker" = "https://github.com/sebastianspicker/zammad-ticket-archiver/issues"

[project.scripts]
zammad-pdf-archiver = "zammad_pdf_archiver.runtime:main"
zammad-archiver-cli = "zammad_pdf_archiver.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zammad_pdf_archiver = [
  "py.typed",
  "templates/**/*.css",
  "templates/**/*.html",
  "static/**/*.css",
  "static/**/*.js",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = [
  "^build/",
  "^dist/",
  "^scripts/",
]

[[tool.mypy.overrides]]
# asn1crypto and weasyprint have no type stubs; ignores are intentional
module = ["asn1crypto.*", "weasyprint.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/zammad_pdf_archiver"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--ignore=.env.example --ignore=.pytest_cache -p no:cacheprovider"
