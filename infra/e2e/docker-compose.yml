services:
  archive-init:
    image: zammad-pdf-archiver:e2e
    user: "0:0"
    command: ["chown", "10001:10001", "/tmp/archive"]
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    volumes:
      - archive:/tmp/archive

  archiver:
    image: zammad-pdf-archiver:e2e
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "18080:8080"
    environment:
      SERVER__HOST: 0.0.0.0
      SERVER__PORT: 8080
      ZAMMAD__BASE_URL: http://mock:9090
      ZAMMAD__API_TOKEN: e2e-token
      ZAMMAD__WEBHOOK_HMAC_SECRET: e2e-webhook-secret
      STORAGE__ROOT: /tmp/archive
      SIGNING__ENABLED: "true"
      SIGNING__PFX_PATH: /run/e2e-signing/e2e-signing.pfx
      SIGNING__PFX_PASSWORD: "${ZTA_E2E_PFX_PASSWORD:?ZTA_E2E_PFX_PASSWORD must be set}"
      HARDENING__TRANSPORT__ALLOW_INSECURE_HTTP: "true"
      HARDENING__TRANSPORT__ALLOW_PRIVATE_NETWORKS: "true"
      OBSERVABILITY__HISTORY_ENABLED: "true"
      OBSERVABILITY__HISTORY_BEARER_TOKEN: e2e-history-token
      RETRY_BEARER_TOKEN: e2e-admin-token
    volumes:
      - archive:/tmp/archive
      - "${ZTA_E2E_SIGNING_DIR:?ZTA_E2E_SIGNING_DIR must point to ephemeral signing material}:/run/e2e-signing:ro"
    depends_on:
      archive-init:
        condition: service_completed_successfully
      mock:
        condition: service_healthy

  mock:
    image: zammad-pdf-archiver:e2e
    command: ["uvicorn", "mock_zammad:app", "--host", "0.0.0.0", "--port", "9090"]
    ports:
      - "18090:9090"
    volumes:
      - ./mock_zammad.py:/app/mock_zammad.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/healthz')"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  archive:
